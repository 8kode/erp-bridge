[project]
name = "factory_correspondence"
authors = [
    { name = "Factory Correspondence", email = "admin@example.com" }
]
description = "Factory Correspondence Management System for ERPNext v16 - manage incoming, outgoing and internal correspondence with assignments, tasks, SLA tracking, escalation and reports"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
